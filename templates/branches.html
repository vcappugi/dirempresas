<!-- View: Sucursales (Tab panel, initially hidden) -->
<section id="view-branches" class="dashboard-view hidden space-y-6">
  <div class="p-6 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm space-y-4">
    <div class="border-b border-slate-100 dark:border-slate-800/80 pb-3 flex items-center justify-between">
      <div>
        <h2 class="font-display font-bold text-lg text-slate-800 dark:text-white">Listado de Sucursales</h2>
        <p class="text-xs text-slate-400">Administra las sucursales operativas asociadas a cada empresa.</p>
      </div>
    </div>
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="relative flex-1 max-w-md">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
        <input type="text" id="branches-search" placeholder="Buscar por nombre..." class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all">
      </div>
      <button id="btn-add-branch" class="inline-flex items-center gap-2 px-4 py-2.5 text-xs font-semibold text-white bg-brand hover:bg-brand-light rounded-xl shadow-lg shadow-brand/10 transition-all duration-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4.5v15m7.5-7.5h-15"></path>
        </svg>
        Añadir Sucursal
      </button>
    </div>
    
    <!-- Branches Table -->
    <div class="overflow-x-auto relative">
      
      <!-- Loading Indicator -->
      <div id="branches-loading" class="absolute inset-0 bg-white/60 dark:bg-slate-900/60 backdrop-blur-sm z-10 flex items-center justify-center hidden">
        <svg class="animate-spin h-8 w-8 text-brand" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>

      <table class="w-full text-sm text-left text-slate-500 dark:text-slate-400">
        <thead class="text-xs text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-950 uppercase tracking-wider">
          <tr>
            <th scope="col" class="px-6 py-4">ID</th>
            <th scope="col" class="px-6 py-4">Nombre</th>
            <th scope="col" class="px-6 py-4">Empresa</th>
            <th scope="col" class="px-6 py-4">Región</th>
            <th scope="col" class="px-6 py-4">Sistema</th>
            <th scope="col" class="px-6 py-4">Fecha Apertura</th>
            <th scope="col" class="px-6 py-4">Estatus</th>
            <th scope="col" class="px-6 py-4 text-right">Acciones</th>
          </tr>
        </thead>
        <tbody id="branches-table-body" class="divide-y divide-slate-100 dark:divide-slate-800">
          <!-- Dynamically loaded rows -->
        </tbody>
      </table>

      <!-- Empty State -->
      <div id="branches-empty" class="py-12 text-center hidden">
        <svg class="w-12 h-12 text-slate-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
        </svg>
        <p class="text-slate-500 font-semibold text-sm">No se encontraron sucursales registradas.</p>
      </div>

      <!-- Branches Pagination Controls -->
      <div id="branches-pagination" class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-100 dark:border-slate-800">
        <div class="text-xs text-slate-500">
          Mostrando <span id="branches-range-start" class="font-semibold text-slate-700 dark:text-slate-350">0</span> a <span id="branches-range-end" class="font-semibold text-slate-700 dark:text-slate-350">0</span> de <span id="branches-total-count" class="font-semibold text-slate-700 dark:text-slate-350">0</span> registros
        </div>
        <div class="flex items-center gap-2">
          <button id="branches-btn-prev" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-850 disabled:opacity-50 disabled:pointer-events-none transition-all">
            Anterior
          </button>
          <span class="text-xs text-slate-500">Pág. <span id="branches-current-page" class="font-semibold text-slate-700 dark:text-slate-350">1</span> de <span id="branches-total-pages" class="font-semibold text-slate-700 dark:text-slate-350">1</span></span>
          <button id="branches-btn-next" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-850 disabled:opacity-50 disabled:pointer-events-none transition-all">
            Siguiente
          </button>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- Branch Modal for Create/Edit -->
<div id="branch-modal-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm hidden opacity-0 transition-all duration-300">
  <div id="branch-modal-card" class="bg-white dark:bg-slate-900 w-full max-w-lg p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl relative space-y-6 scale-95 opacity-0 transition-all duration-300">
    
    <!-- Close Button -->
    <button id="btn-close-branch-modal" class="absolute top-6 right-6 p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <div>
      <h3 id="branch-modal-title" class="font-display font-bold text-xl text-slate-900 dark:text-white">Crear Sucursal</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400">Rellene los datos de la sucursal.</p>
    </div>

    <form id="branch-form" class="space-y-5">
      <input type="hidden" id="branch-form-id">
      
      <!-- Nombre input -->
      <div class="relative">
        <input type="text" id="branch-form-nombre" required placeholder=" " class="peer block w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-transparent focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300">
        <label for="branch-form-nombre" class="absolute left-4 top-3 origin-[0] -translate-y-4 scale-75 transform text-slate-500 duration-300 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-brand bg-white dark:bg-slate-900 px-1.5">Nombre de la Sucursal</label>
      </div>

      <!-- Empresa (Select dinámico) -->
      <div class="relative">
        <select id="branch-form-empresa" required class="block w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300">
          <!-- Carga dinámica -->
        </select>
        <label for="branch-form-empresa" class="absolute left-4 -translate-y-4 scale-75 transform text-slate-500 bg-white dark:bg-slate-900 px-1.5 z-10">Empresa Asociada</label>
      </div>

      <!-- Región (Select dinámico) -->
      <div class="relative">
        <select id="branch-form-region" required class="block w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300">
          <!-- Carga dinámica -->
        </select>
        <label for="branch-form-region" class="absolute left-4 -translate-y-4 scale-75 transform text-slate-500 bg-white dark:bg-slate-900 px-1.5 z-10">Región</label>
      </div>

      <!-- Sistema input -->
      <div class="relative">
        <input type="text" id="branch-form-sistema" placeholder=" " class="peer block w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-transparent focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300">
        <label for="branch-form-sistema" class="absolute left-4 top-3 origin-[0] -translate-y-4 scale-75 transform text-slate-500 duration-300 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-brand bg-white dark:bg-slate-900 px-1.5">Sistema (ej: SAP)</label>
      </div>

      <!-- Fecha Apertura picker -->
      <div class="relative">
        <input type="date" id="branch-form-fecha" placeholder=" " class="peer block w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300">
        <label for="branch-form-fecha" class="absolute left-4 -translate-y-4 scale-75 transform text-slate-500 bg-white dark:bg-slate-900 px-1.5 z-10">Fecha de Apertura</label>
      </div>

      <!-- Estatus Operativo input -->
      <div class="relative">
        <input type="text" id="branch-form-estatus" placeholder=" " class="peer block w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-transparent focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all duration-300">
        <label for="branch-form-estatus" class="absolute left-4 top-3 origin-[0] -translate-y-4 scale-75 transform text-slate-500 duration-300 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-brand bg-white dark:bg-slate-900 px-1.5">Estatus Operativo (ej: Activa, Cerrada)</label>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-4 pt-3">
        <button type="button" id="btn-cancel-branch-modal" class="flex-1 py-3 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-350 dark:hover:bg-slate-700 rounded-xl transition-all">
          Cancelar
        </button>
        <button type="submit" id="btn-save-branch-modal" class="flex-1 py-3 text-sm font-semibold text-white bg-brand hover:bg-brand-light focus:ring-4 focus:ring-brand-200 rounded-xl transition-all shadow-lg shadow-brand/10">
          Guardar
        </button>
      </div>
    </form>

  </div>
</div>
